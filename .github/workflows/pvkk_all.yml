name: 🏗️ PVKK Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux editor'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows all'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS editor'
        type: boolean
        default: true

jobs:
  # ─────────────────────────────────────────────
  # Linux Editor  (x86_64)
  # ─────────────────────────────────────────────
  build-linux-editor:
    name: 🐧 Linux Editor
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev \
            yasm

      - name: Build – Linux Editor x86_64
        run: |
          scons target=editor platform=linuxbsd arch=x86_64 -j$(nproc)

      - name: Prepare artifact
        run: |
          strip bin/godot.linuxbsd.editor.x86_64
          chmod +x bin/godot.linuxbsd.editor.x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-editor-x86_64
          path: bin/godot.linuxbsd.editor.x86_64

  # ─────────────────────────────────────────────
  # macOS Editor (arm64 only)
  # Apple Silicon has been the only Mac Apple sells
  # since June 2023, and macOS 26+ dropped Intel
  # support entirely — so this skips x86_64 and the
  # lipo merge step to save build time. Built
  # natively on a real Mac runner, so Apple's SDK
  # is just preinstalled with Xcode (same approach
  # Godot's own CI uses — no SDK-hosting workaround
  # needed the way it would be cross-compiling on
  # Linux).
  # ─────────────────────────────────────────────
  build-macos-editor:
    name: 🍎 macOS Editor (arm64)
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # See https://github.com/actions/runner-images/blob/main/images/macos
      # for which Xcode versions are preinstalled on macos-latest; adjust
      # the version below if it drifts out of date.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Python + SCons
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          pip3 install scons requests --break-system-packages

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Build – macOS Editor arm64
        run: |
          scons target=editor platform=macos arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} generate_bundle=yes -j$(sysctl -n hw.logicalcpu)

      - name: Prepare artifact
        run: |
          # generate_bundle=yes makes scons wrap the binary into a .app
          # using misc/dist/macos_tools.app as the template, and strip
          # the raw binary inside it. Find whatever it produced rather
          # than hardcoding a name, since the exact filename can shift
          # between Godot versions.
          APP_PATH=$(find bin -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in bin/ after build"
            exit 1
          fi
          mv "$APP_PATH" bin/Godot.app
          chmod +x bin/Godot.app/Contents/MacOS/*
          ditto -c -k --sequesterRsrc --keepParent bin/Godot.app bin/Godot-macos-editor-arm64.zip

      - name: Verify executable bit survived
        run: |
          test -x bin/Godot.app/Contents/MacOS/Godot || (echo "::error::Godot binary inside the .app bundle is not executable" && exit 1)
          ls -l bin/Godot.app/Contents/MacOS

      - name: Sanity check binary
        run: |
          bin/Godot.app/Contents/MacOS/Godot --version
          bin/Godot.app/Contents/MacOS/Godot --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-macos-editor-arm64
          path: bin/Godot-macos-editor-arm64.zip

  # ─────────────────────────────────────────────
  # Windows Builds (MSVC)
  # ─────────────────────────────────────────────
  build-windows:
    name: 🪟 Windows Builds
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor
            target: editor
            artifact: godot-windows-editor-x86_64
            bin: bin/godot.windows.editor.x86_64.exe

          - name: Template Debug
            target: template_debug
            artifact: godot-windows-template-debug-x86_64
            bin: bin/godot.windows.template_debug.x86_64.exe

          - name: Template Release
            target: template_release
            artifact: godot-windows-template-release-x86_64
            bin: bin/godot.windows.template_release.x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python + SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons requests

      # ─────────────────────────────────────────
      # D3D12 (non-fatal)
      # ─────────────────────────────────────────
      - name: Fetch D3D12 dependencies
        id: d3d12
        shell: pwsh
        run: |
          try {
            python misc/scripts/install_d3d12_sdk_windows.py
            echo "enabled=yes" >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host "D3D12 fetch failed, continuing without it"
            echo "enabled=no" >> $env:GITHUB_OUTPUT
          }

      # ─────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────
      - name: Build (${{ matrix.name }})
        shell: pwsh
        run: |
          scons `
            platform=windows `
            target=${{ matrix.target }} `
            arch=x86_64 `
            debug_symbols=yes `
            d3d12=${{ steps.d3d12.outputs.enabled }}

      - name: Compute PDB path
        id: paths
        shell: pwsh
        run: |
          $pdb = "${{ matrix.bin }}" -replace "\.exe$", ".pdb"
          echo "pdb=$pdb" >> $env:GITHUB_OUTPUT

      - name: Validate build output
        shell: pwsh
        run: |
          if (!(Test-Path "${{ matrix.bin }}")) { throw "Missing EXE: ${{ matrix.bin }}" }
          if (!(Test-Path "${{ steps.paths.outputs.pdb }}")) { throw "Missing PDB: ${{ steps.paths.outputs.pdb }}" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bin }}
            ${{ steps.paths.outputs.pdb }}